<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用 XUAN 与 LINDA 的字形讲述十二种关于自己的事。">
  <title>MY NAME IS — 用字形介绍自己</title>
  <style>
    :root { --ink: #050505; --paper: #fff; --sans: "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, "Microsoft YaHei", sans-serif; }
    button { cursor: pointer; font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    main { min-height: 100vh; overflow: hidden; }
    .site-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 70px; padding: 0 4vw; border-bottom: 1px solid var(--ink); font: 700 11px/1 Consolas, monospace; letter-spacing: .09em; }
    .site-header span:nth-child(2) { justify-self: center; }
    .site-header span:last-child { justify-self: end; }
    .project-intro { display: grid; grid-template-columns: .45fr 1.55fr; gap: 4vw; padding: clamp(60px, 8vw, 118px) 4vw clamp(48px, 6vw, 88px); border-bottom: 1px solid var(--ink); }
    .project-intro > p:first-child { margin: 7px 0 0; font-size: 13px; }
    .project-intro h1 { max-width: 1020px; margin: 0; font-size: clamp(48px, 6.8vw, 104px); line-height: .95; letter-spacing: -.065em; }
    .intro-note { grid-column: 2; max-width: 710px; margin: 28px 0 0; font-size: 18px; line-height: 1.45; }
    .studio { padding: clamp(42px, 5vw, 78px) 4vw; }

    .scene-toolbar { display: grid; grid-template-columns: 62px 1fr 62px; margin-top: 22px; border: 1px solid var(--ink); border-bottom: 0; }
    .scene-toolbar button { min-height: 62px; border: 0; background: var(--paper); font-size: 24px; }
    .scene-toolbar button:first-child { border-right: 1px solid var(--ink); }
    .scene-toolbar button:last-child { border-left: 1px solid var(--ink); }
    .scene-toolbar button:hover, .scene-toolbar button:focus-visible { background: var(--ink); color: var(--paper); }
    .scene-toolbar div { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .scene-toolbar span { font: 11px/1 Consolas, monospace; }
    .scene-toolbar strong { font-size: 18px; }
    .scene-toolbar b { padding: 5px 8px; border: 1px solid; font: 700 10px/1 Consolas, monospace; letter-spacing: .08em; }

    /* ---------- compare bar ---------- */
    .view-bar { display: flex; align-items: stretch; border: 1px solid var(--ink); border-bottom: 0; font: 700 10px/1 Consolas, monospace; letter-spacing: .08em; }
    .view-bar > span { display: flex; align-items: center; padding: 0 14px; border-right: 1px solid var(--ink); }
    .view-bar button { flex: 1; min-height: 44px; border: 0; border-right: 1px solid var(--ink); background: var(--paper); font: inherit; }
    .view-bar button:last-child { border-right: 0; }
    .view-bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .view-bar button:hover:not([aria-pressed="true"]) { background: #eee; }

    /* ---------- stage / panes ---------- */
    .stage-wrap { display: grid; grid-template-columns: 1fr; }
    .pane { position: relative; }
    .pane-tag { position: absolute; z-index: 30; top: 0; left: 0; padding: 5px 8px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: var(--paper); color: var(--ink); font: 700 9px/1 Consolas, monospace; letter-spacing: .09em; }
    .stage-wrap[data-view="web"] .pane-orig,
    .stage-wrap[data-view="orig"] .pane-web { display: none; }
    .stage-wrap[data-view="web"] .pane-tag,
    .stage-wrap[data-view="orig"] .pane-tag { display: none; }
    .stage-wrap[data-view="both"] { grid-template-columns: 1fr 1fr; }
    .stage-wrap[data-view="both"] .pane-orig .meaning-card { border-left: 0; }

    .meaning-card { position: relative; aspect-ratio: 7 / 5; overflow: hidden; border: 1px solid var(--ink); background: var(--paper); container-type: inline-size; }
    .card-prefix, .card-statement { position: absolute; left: 50%; z-index: 20; margin: 0; font-family: var(--sans); font-weight: 400; transform: translateX(-50%); white-space: nowrap; }
    .card-prefix { top: 8.5%; font-size: clamp(10px, 3.3cqw, 60px); }
    .card-statement { bottom: 7.5%; font-size: clamp(10px, 3.3cqw, 60px); }
    .scene-object { position: absolute; inset: 17% 4% 16%; font-family: var(--sans); font-weight: 400; }
    .orig-figure { position: absolute; inset: 0; display: grid; place-items: center; padding: 0; margin: 0; background: var(--paper); }
    .orig-figure img { display: block; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }

    .meaning-explainer { display: grid; grid-template-columns: .45fr 1.25fr .75fr; gap: 3vw; padding: 26px 0 0; }
    .meaning-explainer span { font: 700 11px/1 Consolas, monospace; letter-spacing: .08em; }
    .meaning-explainer p { max-width: 720px; margin: 0; font-size: clamp(17px, 1.7vw, 24px); line-height: 1.4; }
    .meaning-explainer small { align-self: end; font-size: 12px; line-height: 1.4; }

    /* ---------- 01 game ---------- */
    .game-name { display: flex; align-items: center; justify-content: center; gap: .01em; font-size: clamp(34px, 16cqw, 400px); }
    .game-name > span { position: relative; display: inline-grid; place-items: center; min-width: .82em; }
    .game-control { z-index: 2; animation: button-press 1.7s cubic-bezier(.35,.05,.25,1) infinite; }
    .game-a { animation-delay: -.85s; }
    .pad-ring, .pad-ring2, .pad-ghost { position: absolute; z-index: -1; aspect-ratio: 1; border-radius: 50%; }
    .pad-ring { width: 1.02em; border: .012em solid var(--ink); }
    .pad-ring2 { width: .9em; border: .012em solid #cdcdcd; }
    .pad-ghost { width: 1.1em; border: .012em solid #e8e8e8; translate: .045em .035em; }
    .ghost-letter { position: absolute; z-index: -1; color: #e6e6e6; translate: .045em .03em; scale: 1.06; }
    .game-card:hover .game-control { animation-duration: .6s; }
    @keyframes button-press { 0%,34%,70%,100% { transform: translateY(0); } 42% { transform: translateY(.055em) scale(.975); } 52% { transform: translateY(.075em) scale(.96); } 60% { transform: translateY(.03em) scale(.985); } }

    /* ---------- 02 algebra ---------- */
    .algebra-name { display: flex; align-items: center; justify-content: center; gap: 0; font-size: clamp(28px, 12.5cqw, 320px); }
    .axis-l { position: relative; display: block; width: .6em; height: 1.02em; flex: none; }
    .axis-l::before { content: ''; position: absolute; left: 0; top: 0; width: .105em; height: 100%; background: var(--ink); }
    .axis-l::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: .105em; background: var(--ink); }
    .axis-arrow { position: absolute; left: .05em; bottom: .105em; width: .5em; height: .016em; background: var(--ink); transform-origin: left center; animation: vector-grow 2.1s ease-in-out infinite; }
    .axis-arrow::after { content: ''; position: absolute; right: -.005em; top: 50%; width: .095em; aspect-ratio: 1; border-top: .016em solid; border-right: .016em solid; transform: translateY(-50%) rotate(45deg); }
    .axis-x { rotate: -20deg; width: .62em; }
    .axis-y { rotate: -60deg; width: .7em; animation-delay: -1.05s; }
    .axis-diag { position: absolute; left: .05em; bottom: .105em; width: .66em; height: .012em; background: var(--ink); transform-origin: left center; rotate: -72deg; }
    .algebra-flee { display: inline-block; animation: avoid-axis 3s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.18s); }
    .algebra-flee > b { display: inline-block; font-weight: 400; }
    .al-gap { flex: none; width: .95em; }
    .flee-1 { --run-x: -14px; --run-y: -26px; }
    .flee-2 { --run-x: 10px; --run-y: 20px; }
    .flee-3 { --run-x: 22px; --run-y: -16px; }
    .flee-4 { --run-x: 34px; --run-y: 14px; }
    .al-i > b { transform: rotate(-10deg) scale(1.05, 1.18); }
    .al-n { margin-left: -.1em; }
    .al-n > b { transform: rotate(5deg) scale(1.3, .92); }
    .al-d { margin-left: -.2em; }
    .al-d > b { transform: rotate(-7deg) scale(1.18, 1.05); }
    .al-a { margin-left: -.16em; }
    .al-a > b { transform: rotate(8deg) scale(1.02, 1.16); }
    @keyframes vector-grow { 0%,14% { scale: 0 1; opacity: 0; } 46%,100% { scale: 1 1; opacity: 1; } }
    @keyframes avoid-axis { to { transform: translate(var(--run-x), var(--run-y)); } }

    /* ---------- 03 fasting ---------- */
    .fasting-name { display: flex; align-items: center; justify-content: center; gap: .05em; font-size: clamp(38px, 22.5cqw, 560px); }
    .fasting-name span { display: inline-block; min-width: .62em; text-align: center; }
    .fasting-name .diet-i { position: relative; min-width: .14em; color: transparent; }
    .fasting-name .diet-i::after { content: ''; position: absolute; left: 50%; top: .225em; width: .022em; height: .5em; background: var(--ink); transform: translateX(-50%); transform-origin: center; animation: diet-breathe 2.4s ease-in-out infinite; }
    @keyframes diet-breathe { 0%,100% { scale: 1 1; } 50% { scale: .45 1; } }

    /* ---------- 04 cheers ---------- */
    .cheers-name { display: flex; align-items: center; justify-content: center; gap: 0; font-size: clamp(34px, 23.5cqw, 600px); }
    .letter-cup { position: relative; width: 1.0em; height: 1.2em; margin-top: -.24em; transform-origin: center center; }
    .cup-letter { position: absolute; display: block; line-height: .9; }
    .cup-left-0 { left: -.06em; top: .12em; font-size: 1.34em; transform: rotate(128deg) scale(1,.78); }
    .cup-left-1 { left: .12em; top: .18em; font-size: 1.3em; transform: rotate(38deg) scaleX(.32); }
    .cup-left-2 { left: .28em; top: .2em; font-size: 1.36em; transform: rotate(-6deg) scaleX(.7); }
    .cup-right { margin-left: -.02em; }
    .cup-right-0 { left: -.04em; top: .08em; font-size: 1.44em; transform: rotate(-24deg) scaleX(.82); }
    .cup-right-1 { left: .44em; top: .02em; font-size: 1.32em; transform: rotate(-32deg) scaleX(.74); }
    .cup-left { animation: clink-left 2.4s cubic-bezier(.2,.8,.2,1) infinite; }
    .cup-right { animation: clink-right 2.4s cubic-bezier(.2,.8,.2,1) infinite; }
    .cheers-drops { position: absolute; z-index: 4; top: 18%; left: 50%; width: 1px; height: 1px; }
    .cheers-drops i { position: absolute; font: 400 clamp(18px, 7cqw, 180px)/1 var(--sans); font-style: normal; opacity: 0; animation: cheers-splash 2.4s ease-out infinite; }
    .cheers-drops i:nth-child(1) { --splash-x: -78px; --splash-y: -42px; --splash-r: -18deg; }
    .cheers-drops i:nth-child(2) { --splash-x: 26px; --splash-y: -54px; --splash-r: 8deg; animation-delay: .05s; }
    .cheers-drops i:nth-child(3) { --splash-x: 66px; --splash-y: -46px; --splash-r: 16deg; animation-delay: .1s; }
    @keyframes clink-left { 0%,22%,76%,100% { transform: translateX(-9%) rotate(6deg); } 46%,54% { transform: translateX(5%) rotate(14deg); } }
    @keyframes clink-right { 0%,22%,76%,100% { transform: translateX(9%) rotate(-6deg); } 46%,54% { transform: translateX(-5%) rotate(-14deg); } }
    @keyframes cheers-splash { 0%,36% { opacity: 0; transform: translate(0,0) rotate(0) scale(.5); } 46%,78% { opacity: 1; } 96%,100% { opacity: 0; transform: translate(var(--splash-x), var(--splash-y)) rotate(var(--splash-r)) scale(1.05); } }

    /* ---------- 05 stage ---------- */
    .stage-card { background: var(--ink); color: var(--paper); }
    .stage-card .card-prefix, .stage-card .card-statement { color: var(--paper); }
    .stage-name { inset: 0; }
    .spotlight { position: absolute; z-index: 0; top: 19%; left: 50%; width: 53%; height: 67%; background: #fff; clip-path: polygon(45% 0, 55% 0, 100% 64%, 100% 100%, 0 100%, 0 64%); transform: translateX(-50%); transform-origin: top center; animation: light-breathe 4s ease-in-out infinite; }
    .stage-letters { position: absolute; z-index: 1; left: 50%; bottom: 17%; display: flex; gap: .07em; font-size: clamp(34px, 17cqw, 430px); font-weight: 400; line-height: .82; transform: translateX(-50%); }
    .stage-letters span { background: linear-gradient(to bottom, #fdfdfd 0%, #efefef 26%, #8f8f8f 62%, #050505 96%); color: transparent; background-clip: text; -webkit-background-clip: text; }
    @keyframes light-breathe { 0%,100% { opacity: 1; transform: translateX(-50%) scaleX(.96); } 50% { opacity: 1; transform: translateX(-50%) scaleX(1.04); } }

    /* ---------- 06 candy ---------- */
    .candy-name { display: flex; align-items: center; justify-content: center; gap: .01em; font-size: clamp(36px, 24cqw, 610px); }
    .candy-name > span { display: inline-grid; place-items: center; min-width: .56em; }
    .candy-letter { position: relative; display: block; width: .72em; font-size: 1.12em; text-align: center; transform-origin: center; animation: candy-wiggle 2.2s ease-in-out infinite; }
    .candy-letter::after { content: ''; position: absolute; z-index: 2; left: 50%; top: 50%; width: .5em; height: .48em; border-radius: 50%; background: var(--ink); transform: translate(-50%,-50%); }
    @keyframes candy-wiggle { 0%,100% { transform: rotate(-3deg) scaleX(1.1); } 50% { transform: rotate(4deg) translateY(-4px) scaleX(1.1); } }

    /* ---------- 07 arthropod ---------- */
    .arthropod-name { inset: 0; font-size: clamp(36px, 20.5cqw, 510px); }
    .bug-letter { position: absolute; z-index: 4; top: 56%; left: 50%; width: .17em; height: 1.12em; background: var(--ink); transform: translate(-50%,-50%); animation: bug-scuttle .22s steps(2) infinite alternate; }
    .bug-head { position: absolute; left: 50%; top: -.44em; width: .2em; height: .24em; border-radius: 50%; background: var(--ink); transform: translateX(-50%); }
    .bug-head::before, .bug-head::after { content: ''; position: absolute; bottom: 60%; width: 1.5px; height: .42em; background: var(--ink); transform-origin: bottom center; }
    .bug-head::before { left: 18%; rotate: -28deg; }
    .bug-head::after { right: 18%; rotate: 28deg; }
    .bug-leg { position: absolute; top: var(--t); width: var(--len); border-top: 1.5px solid var(--ink); }
    .bug-leg-left { right: 92%; transform: rotate(var(--rot)); transform-origin: right center; }
    .bug-leg-right { left: 92%; transform: rotate(calc(var(--rot) * -1)); transform-origin: left center; }
    .arthropod-flee { position: absolute; font-family: Georgia, "Times New Roman", serif; font-style: italic; animation: flee-edge 2.6s ease-in-out infinite alternate; }
    .arthropod-l { left: -3%; top: 46%; font-size: 1.3em; --edge-x: -22px; --edge-y: 0; --edge-r: -6deg; }
    .arthropod-n { right: -1.5%; top: 34%; font-size: .62em; --edge-x: 20px; --edge-y: -10px; --edge-r: 5deg; }
    .arthropod-d { right: -2.5%; top: 56%; font-size: .62em; --edge-x: 24px; --edge-y: 4px; --edge-r: -4deg; }
    .arthropod-a { right: -1.5%; top: 78%; font-size: .62em; --edge-x: 20px; --edge-y: 14px; --edge-r: 6deg; }
    @keyframes bug-scuttle { to { translate: 6px -4px; rotate: 1.5deg; } }
    @keyframes flee-edge { to { transform: translate(var(--edge-x), var(--edge-y)) rotate(var(--edge-r)); } }

    /* ---------- 08 short ---------- */
    .short-name { inset: 0; display: grid; place-items: center; font-size: clamp(60px, 35cqw, 900px); }
    .short-row { display: flex; align-items: baseline; justify-content: center; gap: .03em; line-height: 1; white-space: nowrap; }
    .short-name span { display: inline-block; }
    .short-name .tiny-letter { align-self: baseline; min-width: .22em; margin-inline: .04em; font-size: .185em; text-align: center; transform-origin: bottom; animation: try-to-grow 2s ease-in-out infinite; }
    @keyframes try-to-grow { 0%,100% { transform: translateY(0) scale(1); } 44% { transform: translateY(-120%) scale(1.3); } 60% { transform: translateY(-104%) scale(1.2); } }

    /* ---------- 09 glasses ---------- */
    .glasses-name { inset: 0; display: grid; place-items: center; font-size: clamp(38px, 24.5cqw, 620px); }
    .gl-stack { position: relative; width: 4.24em; height: 1.2em; }
    .gl-word { position: absolute; left: 0; top: 0; display: flex; align-items: center; width: 4.24em; height: 1.2em; }
    .gl-word b { display: block; width: 1.06em; font-weight: 400; line-height: 1; text-align: center; }
    .gl-blur b:first-child { background: linear-gradient(100deg, #c6c6c6 0%, #8a8a8a 46%, #3a3a3a 100%); color: transparent; background-clip: text; -webkit-background-clip: text; }
    .gl-blur b:last-child { background: linear-gradient(260deg, #c6c6c6 0%, #8a8a8a 46%, #3a3a3a 100%); color: transparent; background-clip: text; -webkit-background-clip: text; }
    .gl-blur { color: #9a9a9a; filter: blur(.035em); animation: eye-defocus 3.4s ease-in-out infinite; }
    .gl-lens { position: absolute; top: .07em; width: 1.06em; height: 1.06em; overflow: hidden; border-radius: 50%; background: #f1f2f3; }
    .gl-lens-1 { left: 1.06em; }
    .gl-lens-2 { left: 2.12em; }
    .gl-lens .gl-word { color: var(--ink); animation: lens-focus 3.4s ease-in-out infinite; }
    .gl-lens-1 .gl-word { left: -1.06em; top: -.07em; transform-origin: 1.59em .6em; }
    .gl-lens-2 .gl-word { left: -2.12em; top: -.07em; transform-origin: 2.65em .6em; }
    .gl-rim { position: absolute; top: .07em; width: 1.06em; height: 1.06em; border: .014em solid #7a7a7a; border-radius: 50%; }
    .gl-rim-1 { left: 1.06em; }
    .gl-rim-2 { left: 2.12em; }
    .gl-bridge { position: absolute; left: 2.03em; top: .58em; width: .2em; height: .05em; background: var(--ink); }
    .gl-temple { position: absolute; top: .66em; width: 1.8em; height: max(3px, .32cqw); background: var(--ink); }
    .gl-temple-l { right: 3.2em; transform: rotate(26deg); transform-origin: right center; }
    .gl-temple-r { left: 3.2em; transform: rotate(-26deg); transform-origin: left center; }
    @keyframes lens-focus { 0%,100% { transform: scale(1.005); } 50% { transform: scale(1.035); } }
    @keyframes eye-defocus { 0%,100% { filter: blur(.028em); } 50% { filter: blur(.05em); } }

    /* ---------- 10 swim ---------- */
    .swim-name { inset: 0; }
    .swim-column, .bubbles { position: absolute; inset: 0; }
    .swim-column span { position: absolute; left: var(--x); top: var(--y); font-size: clamp(22px, 10.5cqw, 270px); rotate: var(--r); animation: sink-letter 5s cubic-bezier(.3,.02,.5,1) infinite; animation-delay: calc(var(--i) * -.3s - 1.6s); }
    .swim-column .swim-d { display: inline-block; transform: scale(1.1, .88) skewX(-6deg); }
    .bubbles i { position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); width: calc(var(--s) * 1cqw); aspect-ratio: 1; border: max(1.5px, .2cqw) solid var(--ink); border-radius: 50%; opacity: .9; animation: bubble-up 4s linear infinite; animation-delay: calc(var(--d) * -.55s); }
    @keyframes sink-letter { 0%,8% { transform: translateY(-26px); opacity: 0; } 20% { opacity: 1; } 78% { opacity: .92; } 100% { transform: translateY(140px); opacity: .1; } }
    @keyframes bubble-up { 0% { transform: translateY(60px) scale(.7); opacity: 0; } 14%,74% { opacity: 1; } 100% { transform: translate(10px,-180px) scale(1.1); opacity: 0; } }

    /* ---------- 11 roller ---------- */
    .roller-name { inset: 0; }
    .coaster-svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .coaster-svg > path { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
    .coaster-svg text { fill: var(--ink); font-family: var(--sans); font-weight: 400; dominant-baseline: middle; }
    .coaster-riders { animation: rider-shudder .26s steps(2) infinite alternate; transform-origin: 20% 80%; }
    @keyframes rider-shudder { to { transform: translate(2px, -2px) rotate(.4deg); } }

    /* ---------- 12 guns ---------- */
    .guns-name { inset: 0; display: flex; align-items: center; }
    .gun-shape { position: relative; z-index: 2; flex: none; width: 45%; height: 40%; margin-left: 3%; margin-bottom: 9%; background: var(--ink); clip-path: polygon(1% 30%, 70% 8%, 71% 42%, 20% 56%, 20% 98%, 1% 98%); }
    .letter-bullets { position: relative; display: flex; align-items: center; width: 55%; margin-left: 0; margin-bottom: 22%; font-size: clamp(16px, 6.4cqw, 170px); }
    .letter-bullets span { display: inline-block; color: rgba(5,5,5,var(--opacity)); font-weight: var(--weight); animation: slow-bullet 2.8s cubic-bezier(.18,.7,.22,1) infinite; animation-delay: calc(var(--i) * -.18s); }
    .letter-bullets span:nth-child(2) { margin-left: .7em; }
    .letter-bullets span:nth-child(3) { margin-left: 1.4em; }
    .letter-bullets span:nth-child(4) { margin-left: 2.6em; }
    @keyframes slow-bullet { 0%,100% { transform: translateX(0); } 50% { transform: translateX(calc(8px + var(--i) * 20px)); } 66% { transform: translateX(calc(5px + var(--i) * 14px)); } }

    /* ---------- lightbox ---------- */
    .lightbox { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; padding: 4vw; background: rgba(5,5,5,.9); }
    .lightbox[open] { display: grid; }
    .lightbox img { max-width: 100%; max-height: 88vh; background: #fff; }
    .lightbox button { position: absolute; top: 18px; right: 18px; padding: 10px 14px; border: 1px solid #fff; background: transparent; color: #fff; font: 700 11px/1 Consolas, monospace; letter-spacing: .08em; }

    .scene-index { padding: clamp(65px,8vw,120px) 4vw; border-top: 1px solid var(--ink); }
    .index-heading { display: grid; grid-template-columns: .45fr 1.55fr; gap: 4vw; margin-bottom: 36px; }
    .index-heading p { margin: 5px 0 0; font: 700 11px/1 Consolas,monospace; letter-spacing: .08em; }
    .index-heading h2 { margin: 0; font-size: clamp(38px,5.3vw,78px); line-height: .98; letter-spacing: -.055em; }

    const scenes = [
      ['game','01','XUAN','电子游戏','我喜欢玩电子游戏','X 和 A 的交叉字形被两圈同心圆框住，模拟游戏手柄上的经典按键，并带着手柄按键按压的动态残影效果；U 和 N 保持原样。','X 与 A 会自动播放下压的动画效果。'],

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const letters = name => [...name];
    const attrs = values => Object.entries(values).map(([key,value]) => `--${key}:${value}`).join(';');

    function sceneHTML(scene) {
      const name = letters(scene.name);

      if (scene.id === 'game') return `<div class="scene-object game-name" aria-label="XUAN">${name.map(letter => {
        const pad = letter === 'X' || letter === 'A';
        return `<span class="${pad ? `game-control game-${letter.toLowerCase()}` : ''}">${pad ? `<i class="pad-ghost" aria-hidden="true"></i><i class="pad-ring" aria-hidden="true"></i><i class="pad-ring2" aria-hidden="true"></i><b class="ghost-letter" aria-hidden="true">${letter}</b>` : ''}${letter}</span>`;
      }).join('')}</div>`;

      if (scene.id === 'algebra') return `<div class="scene-object algebra-name" aria-label="LINDA">
        <b class="axis-l" aria-hidden="true"><i class="axis-diag"></i><i class="axis-arrow axis-x"></i><i class="axis-arrow axis-y"></i></b>
        <i class="al-gap" aria-hidden="true"></i>
        ${name.slice(1).map((letter,i) => `<span class="algebra-flee flee-${i+1} al-${letter.toLowerCase()}" style="--i:${i}"><b>${letter}</b></span>`).join('')}
      </div>`;

      if (scene.id === 'fasting') return `<div class="scene-object fasting-name" aria-label="LINDA">${name.map(letter => `<span class="${letter === 'I' ? 'diet-i' : ''}">${letter}</span>`).join('')}</div>`;

      if (scene.id === 'cheers') return `<div class="scene-object cheers-name" aria-label="LINDA"><div class="letter-cup cup-left">${name.slice(0,3).map((letter,i) => `<span class="cup-letter cup-left-${i}">${letter}</span>`).join('')}</div><div class="cheers-drops" aria-hidden="true"><i>’</i><i>‘</i><i>‘</i></div><div class="letter-cup cup-right">${name.slice(3).map((letter,i) => `<span class="cup-letter cup-right-${i}">${letter}</span>`).join('')}</div></div>`;

      if (scene.id === 'stage') return `<div class="scene-object stage-name" aria-label="XUAN"><i class="spotlight" aria-hidden="true"></i><div class="stage-letters">${name.map(letter => `<span>${letter}</span>`).join('')}</div></div>`;

      if (scene.id === 'candy') return `<div class="scene-object candy-name" aria-label="XUAN"><span><b class="candy-letter">X</b></span>${name.slice(1).map(letter => `<span>${letter}</span>`).join('')}</div>`;

      if (scene.id === 'arthropod') {
        const legs = side => Array.from({length:22},(_,i) => `<b class="bug-leg bug-leg-${side}" style="${attrs({t:(1+i*4.6)+'%',len:(.13+((i*31)%7)*.023)+'em',rot:(side==='left'?-1:1)*(4+(i/22)*11+((i*29)%7)*2.6)+'deg'})}"></b>`).join('');
        return `<div class="scene-object arthropod-name" aria-label="LINDA">
          <span class="arthropod-flee arthropod-l">L</span>
          <span class="bug-letter" aria-hidden="true"><i class="bug-head"></i>${legs('left')}${legs('right')}</span>
          <span class="arthropod-flee arthropod-n">n</span><span class="arthropod-flee arthropod-d">d</span><span class="arthropod-flee arthropod-a">a</span>
        </div>`;
      }

      if (scene.id === 'short') return `<div class="scene-object short-name" aria-label="LINDA"><div class="short-row">${name.map(letter => `<span class="${letter === 'I' ? 'tiny-letter' : ''}">${letter === 'I' ? 'i' : letter}</span>`).join('')}</div></div>`;

      if (scene.id === 'glasses') {
        const word = extra => `<span class="gl-word ${extra}">${name.map(letter => `<b>${letter}</b>`).join('')}</span>`;
        return `<div class="scene-object glasses-name" aria-label="XUAN"><div class="gl-stack">
          ${word('gl-blur')}
          <i class="gl-lens gl-lens-1" aria-hidden="true">${word('gl-sharp')}</i>
          <i class="gl-lens gl-lens-2" aria-hidden="true">${word('gl-sharp')}</i>
          <i class="gl-rim gl-rim-1" aria-hidden="true"></i><i class="gl-rim gl-rim-2" aria-hidden="true"></i>
          <i class="gl-bridge" aria-hidden="true"></i>
          <i class="gl-temple gl-temple-l" aria-hidden="true"></i><i class="gl-temple gl-temple-r" aria-hidden="true"></i>
        </div></div>`;
      }

      if (scene.id === 'swim') {
        const place = [['6%','2%','-22deg'],['24%','16%','4deg'],['28%','46%','-9deg'],['35%','68%','-24deg'],['50%','88%','11deg']];
        return `<div class="scene-object swim-name" aria-label="LINDA"><div class="swim-column">${name.map((letter,i) => `<span style="${attrs({i,x:place[i][0],y:place[i][1],r:place[i][2]})}"><b class="${letter==='D'?'swim-d':''}">${letter}</b></span>`).join('')}</div><div class="bubbles" aria-hidden="true">${Array.from({length:24},(_,i) => `<i style="${attrs({x:(10+(i*13)%34+(i*0.45)).toFixed(1),y:(2+(i*13)%88).toFixed(1),s:(.75+(i%6)*.4).toFixed(2),d:i%8})}"></i>`).join('')}</div></div>`;
      }

      if (scene.id === 'roller') {
        const count = 12, dur = 5.4, from = 21, to = 99;
        const glide = i => reduceMotion ? '' : `<animate attributeName="startOffset" values="${from}%;${to}%" dur="${dur}s" begin="${(-i * dur / count).toFixed(2)}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".58 0 .46 1"/>`;
        const fade = i => reduceMotion ? '' : `<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.88;1" dur="${dur}s" begin="${(-i * dur / count).toFixed(2)}s" repeatCount="indefinite"/>`;
        return `<div class="scene-object roller-name" aria-label="XUAN"><svg class="coaster-svg" viewBox="0 0 1000 700" role="img" aria-label="XUAN 和一串 N 沿同一条过山车轨道滑行">
          <path id="coaster-route" d="M 185 552 C 272 590, 352 556, 390 474 C 436 368, 388 226, 508 190 C 596 164, 654 186, 676 216"></path>
          <g class="coaster-riders">${['X','U','A'].map((letter,i) => `<text style="font-size:${104-i*9}px"><textPath href="#coaster-route" startOffset="${i*6.6}%">${letter}</textPath></text>`).join('')}</g>
          ${Array.from({length:count},(_,i) => `<text class="coaster-trail-letter" style="font-size:${reduceMotion ? 80-i*1.5 : 72}px"${reduceMotion ? ` opacity="${1-i*.02}"` : ''}>${fade(i)}<textPath href="#coaster-route" startOffset="${reduceMotion ? 23.5+i*6.3 : from}%">N${glide(i)}</textPath></text>`).join('')}
        </svg></div>`;
      }

      return `<div class="scene-object guns-name" aria-label="LINDA"><b class="gun-shape" aria-hidden="true"></b><div class="letter-bullets">${name.slice(1).map((letter,i) => `<span style="${attrs({i,opacity:[.2,.42,.66,1][i],weight:[400,400,400,700][i]})}">${letter}</span>`).join('')}</div></div>`;
    }

    let active = 0;
    const $ = selector => document.querySelector(selector);
    const grid = $('#index-grid');
    const stageWrap = $('#stage-wrap');
    grid.innerHTML = scenes.map((scene,i) => `<button type="button" data-index="${i}"><span>${scene.number}</span><strong>${scene.title}</strong><small>${scene.statement}</small></button>`).join('');

    function show(index, scroll = false) {
      active = (index + scenes.length) % scenes.length;
      const scene = scenes[active];
      $('#header-count').textContent = `${scene.number} / 12`;
      $('#scene-number').textContent = scene.number;
      $('#active-title').textContent = scene.title;
      $('#scene-name').textContent = scene.name;
      $('#statement').textContent = scene.statement;
      $('#meaning').textContent = scene.meaning;
      $('#hint').textContent = scene.hint;
      $('#meaning-card').className = `meaning-card ${scene.id}-card`;
      $('#scene-mount').innerHTML = sceneHTML(scene);
      const image = originals[scene.number];
      $('#orig-image').src = image || '';
      $('#orig-image').alt = `原始平面稿 ${scene.number} — ${scene.title}`;
      grid.querySelectorAll('button').forEach((button,i) => button.classList.toggle('active', i === active));
      if (scroll) $('.studio').scrollIntoView({behavior:'smooth'});
    }

    function setView(view) {
      stageWrap.dataset.view = view;
      document.querySelectorAll('.view-bar button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
    }

    $('#previous').addEventListener('click', () => show(active - 1));
    $('#next').addEventListener('click', () => show(active + 1));
    grid.addEventListener('click', event => { const button = event.target.closest('button[data-index]'); if (button) show(Number(button.dataset.index), true); });
    document.querySelector('.view-bar').addEventListener('click', event => { const button = event.target.closest('button[data-view]'); if (button) setView(button.dataset.view); });
    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') show(active - 1);
      if (event.key === 'ArrowRight') show(active + 1);
      if (event.key === 'Escape') $('#lightbox').removeAttribute('open');
      if (event.key.toLowerCase() === 'c') setView(stageWrap.dataset.view === 'both' ? 'web' : 'both');
    });
    $('#orig-image').addEventListener('click', () => { $('#lightbox-image').src = $('#orig-image').src; $('#lightbox').setAttribute('open',''); });
    $('#lightbox').addEventListener('click', () => $('#lightbox').removeAttribute('open'));
    show(0);
  </script>
</body>
</html>
